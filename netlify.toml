[build]
  publish = "."

# Allow all real files to be served as-is.
# Only fall back to index.html for URLs that don't match a file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Short cache for HTML so updates appear instantly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Short cache for JS/CSS so updates appear instantly after deploy
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
